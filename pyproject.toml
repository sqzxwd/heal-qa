[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heal-qa"
version = "0.1.0"
description = "Self-healing e2e test runner and locator resolver for Playwright/UI tests"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pytest>=8.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
heal-qa = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
